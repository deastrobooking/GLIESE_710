name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build_linux:
    name: Build Linux Artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Cache CPM
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cpm-cache
          key: release-${{ runner.os }}-cpm-${{ hashFiles('CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: |
            release-${{ runner.os }}-cpm-
            ${{ runner.os }}-cpm-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            lv2-dev \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxext-dev \
            libxcomposite-dev \
            libxrender-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libgtk-3-dev

      - name: Configure
        run: |
          CPM_CACHE="$(pwd -W 2>/dev/null || pwd)/.cpm-cache"
          mkdir -p "${CPM_CACHE}"
          echo "CPM cache: ${CPM_CACHE}"
          cmake -S . -B build-productions \
            -G Ninja \
            -DCPM_SOURCE_CACHE="${CPM_CACHE}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DGLIESE_BUILD_TESTS=ON \
            -DGLIESE_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build plugin targets
        run: cmake --build build-productions --target GLIESE_710_All --parallel

      - name: Build tests
        run: cmake --build build-productions --target GLIESE_Tests --parallel

      - name: Run tests
        run: ctest --test-dir build-productions --output-on-failure

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-linux
          if-no-files-found: error
          path: |
            build-productions/GLIESE_710_artefacts/Release/VST3/GLIESE 710.vst3
            build-productions/GLIESE_710_artefacts/Release/CLAP/GLIESE 710.clap
            build-productions/GLIESE_710_artefacts/Release/LV2/GLIESE 710.lv2
            build-productions/GLIESE_710_artefacts/Release/Standalone/GLIESE 710

  build_macos:
    name: Build macOS Artifacts
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Cache CPM
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cpm-cache
          key: release-${{ runner.os }}-cpm-${{ hashFiles('CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: |
            release-${{ runner.os }}-cpm-
            ${{ runner.os }}-cpm-

      - name: Configure
        run: |
          CPM_CACHE="$(pwd -W 2>/dev/null || pwd)/.cpm-cache"
          mkdir -p "${CPM_CACHE}"
          echo "CPM cache: ${CPM_CACHE}"
          cmake -S . -B build-productions \
            -G Xcode \
            -DCPM_SOURCE_CACHE="${CPM_CACHE}" \
            -DGLIESE_BUILD_TESTS=ON \
            -DGLIESE_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build plugin targets
        run: cmake --build build-productions --config Release --target GLIESE_710_All --parallel

      - name: Build tests
        run: cmake --build build-productions --config Release --target GLIESE_Tests --parallel

      - name: Run tests
        run: ctest --test-dir build-productions -C Release --output-on-failure

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-macos
          if-no-files-found: error
          path: |
            build-productions/GLIESE_710_artefacts/Release/VST3/GLIESE 710.vst3
            build-productions/GLIESE_710_artefacts/Release/AU/GLIESE 710.component
            build-productions/GLIESE_710_artefacts/Release/CLAP/GLIESE 710.clap
            build-productions/GLIESE_710_artefacts/Release/Standalone/GLIESE 710.app

  build_windows:
    name: Build Windows Artifacts
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Configure git for dependency fetches
        run: git config --global core.longpaths true

      - name: Cache CPM
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cpm-cache
          key: release-${{ runner.os }}-cpm-${{ hashFiles('CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: |
            release-${{ runner.os }}-cpm-
            ${{ runner.os }}-cpm-

      - name: Configure
        run: |
          CPM_CACHE="$(pwd -W 2>/dev/null || pwd)/.cpm-cache"
          mkdir -p "${CPM_CACHE}"
          echo "CPM cache: ${CPM_CACHE}"
          cmake -S . -B build-productions \
            -G "Visual Studio 17 2022" \
            -A x64 \
            -DCPM_SOURCE_CACHE="${CPM_CACHE}" \
            -DGLIESE_BUILD_TESTS=ON \
            -DGLIESE_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build plugin targets
        run: cmake --build build-productions --config Release --target GLIESE_710_All --parallel

      - name: Build tests
        run: cmake --build build-productions --config Release --target GLIESE_Tests --parallel

      - name: Run tests
        run: ctest --test-dir build-productions -C Release --output-on-failure

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-windows
          if-no-files-found: error
          path: |
            build-productions/GLIESE_710_artefacts/Release/VST3/GLIESE 710.vst3
            build-productions/GLIESE_710_artefacts/Release/CLAP/GLIESE 710.clap
            build-productions/GLIESE_710_artefacts/Release/Standalone/GLIESE 710.exe

  package_and_release:
    name: Package and Publish Release
    runs-on: ubuntu-24.04
    needs:
      - build_linux
      - build_macos
      - build_windows
    steps:
      - uses: actions/checkout@v5

      - name: Download platform bundles
        uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Package release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          base_dir="dist/${TAG}"
          mkdir -p "${base_dir}/macos" "${base_dir}/windows" "${base_dir}/linux"

          copy_asset() {
            local src="$1"
            local dst="$2"

            if [[ ! -e "${src}" ]]; then
              echo "::error::Missing release artifact: ${src}"
              find incoming -maxdepth 5 -print
              exit 1
            fi

            cp -R "${src}" "${dst}/"
          }

          copy_asset "incoming/bundles-macos/VST3/GLIESE 710.vst3" "${base_dir}/macos"
          copy_asset "incoming/bundles-macos/AU/GLIESE 710.component" "${base_dir}/macos"
          copy_asset "incoming/bundles-macos/CLAP/GLIESE 710.clap" "${base_dir}/macos"
          copy_asset "incoming/bundles-macos/Standalone/GLIESE 710.app" "${base_dir}/macos"

          copy_asset "incoming/bundles-windows/VST3/GLIESE 710.vst3" "${base_dir}/windows"
          copy_asset "incoming/bundles-windows/CLAP/GLIESE 710.clap" "${base_dir}/windows"
          copy_asset "incoming/bundles-windows/Standalone/GLIESE 710.exe" "${base_dir}/windows"

          copy_asset "incoming/bundles-linux/VST3/GLIESE 710.vst3" "${base_dir}/linux"
          copy_asset "incoming/bundles-linux/CLAP/GLIESE 710.clap" "${base_dir}/linux"
          copy_asset "incoming/bundles-linux/LV2/GLIESE 710.lv2" "${base_dir}/linux"
          copy_asset "incoming/bundles-linux/Standalone/GLIESE 710" "${base_dir}/linux"

          cat > "${base_dir}/macos/README-install.txt" <<'EOF'
          GLIESE 710 macOS Installation

          1. Extract this archive.
          2. Copy GLIESE 710.vst3 to ~/Library/Audio/Plug-Ins/VST3/ or /Library/Audio/Plug-Ins/VST3/.
          3. Copy GLIESE 710.component to ~/Library/Audio/Plug-Ins/Components/ or /Library/Audio/Plug-Ins/Components/.
          4. Copy GLIESE 710.clap to ~/Library/Audio/Plug-Ins/CLAP/ or /Library/Audio/Plug-Ins/CLAP/.
          5. Run GLIESE 710.app directly for non-DAW testing.
          6. Rescan plugins in your DAW.
          EOF

          cat > "${base_dir}/windows/README-install.txt" <<'EOF'
          GLIESE 710 Windows Installation

          1. Extract this archive.
          2. Copy GLIESE 710.vst3 to C:\Program Files\Common Files\VST3\.
          3. Copy GLIESE 710.clap to C:\Program Files\Common Files\CLAP\.
          4. Run GLIESE 710.exe directly for non-DAW testing.
          5. Rescan plugins in your DAW.
          EOF

          cat > "${base_dir}/linux/README-install.txt" <<'EOF'
          GLIESE 710 Linux Installation

          1. Extract this archive.
          2. Copy GLIESE 710.vst3 to ~/.vst3/.
          3. Copy GLIESE 710.clap to ~/.clap/.
          4. Copy GLIESE 710.lv2 to ~/.lv2/.
          5. Run GLIESE 710 directly for non-DAW testing.
          6. Rescan plugins in your DAW.
          EOF

          if [[ -f LICENSE ]]; then
            cp LICENSE "${base_dir}/macos/LICENSE.txt"
            cp LICENSE "${base_dir}/windows/LICENSE.txt"
            cp LICENSE "${base_dir}/linux/LICENSE.txt"
          fi

          pushd "${base_dir}" > /dev/null
          zip -r "../gliese-710-${TAG}-macos-universal.zip" macos
          zip -r "../gliese-710-${TAG}-windows-x64.zip" windows
          zip -r "../gliese-710-${TAG}-linux-x64.zip" linux
          sha256sum "../gliese-710-${TAG}-"*.zip > "../gliese-710-${TAG}-sha256.txt"
          popd > /dev/null

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/gliese-710-${{ github.ref_name }}-macos-universal.zip
            dist/gliese-710-${{ github.ref_name }}-windows-x64.zip
            dist/gliese-710-${{ github.ref_name }}-linux-x64.zip
            dist/gliese-710-${{ github.ref_name }}-sha256.txt
